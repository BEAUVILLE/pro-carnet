name: Public WORLD8 CSS proof

on:
  push:
    branches:
      - test/public-world8-css-proof
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-css-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public HTML and selector CSS
        run: |
          set -euxo pipefail
          curl -fsSL -D /tmp/headers.txt https://pro-carnet.digiylyfe.com/app/index.html -o /tmp/public.html
          echo "=== HEADERS ==="
          cat /tmp/headers.txt
          echo "=== SELECTOR HTML ==="
          grep -n 'id="world8Lang"' /tmp/public.html || true
          echo "=== SELECTOR CSS ==="
          python3 - <<'PY'
          import re
          s=open('/tmp/public.html',encoding='utf-8').read()
          for m in re.finditer(r'\.world8-lang\{[^}]*\}',s):
              print(m.group(0))
          PY
          echo "=== EXPECTED #19 TOKENS ==="
          grep -o 'min-width:156px\|min-height:38px\|font-size:15px' /tmp/public.html | sort | uniq -c || true
