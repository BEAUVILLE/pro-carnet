name: PRO CARNET · WORLD10 formulaire de caisse
on:
  pull_request:
    paths:
      - 'admin.html'
      - 'assets/js/pro-carnet-secondary-world10.js'
      - 'tests/pro-carnet-admin-form-world10.cjs'
      - '.github/workflows/pro-carnet-admin-form-world10.yml'
  push:
    branches: [main]
    paths:
      - 'admin.html'
      - 'assets/js/pro-carnet-secondary-world10.js'
      - 'tests/pro-carnet-admin-form-world10.cjs'
      - '.github/workflows/pro-carnet-admin-form-world10.yml'
permissions:
  contents: read
jobs:
  validate-admin-form:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier saisie PAY 10 langues sans mutation des données
        run: |
          node tests/pro-carnet-admin-world10.cjs
          node tests/pro-carnet-secondary-world10.cjs
          node tests/pro-carnet-action-world10.cjs
          node tests/pro-carnet-admin-form-world10.cjs
