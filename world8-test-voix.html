<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="theme-color" content="#06140f">
<title>WORLD8 — Test voix</title>
<style>
:root{--bg:#06140f;--gold:#f4d27a;--green:#22c55e;--ink:#fff8e8;--muted:#cbd5c8}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#07150f,var(--bg));color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:18px}
.wrap{width:min(680px,100%);margin:auto}.card{border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:20px;background:rgba(255,255,255,.06);box-shadow:0 18px 50px rgba(0,0,0,.28)}
h1{margin:8px 0;color:var(--gold);font-size:30px}p{line-height:1.5;color:var(--muted)}.badge{display:inline-block;padding:7px 11px;border-radius:999px;background:rgba(244,210,122,.12);border:1px solid rgba(244,210,122,.35);color:var(--gold);font-weight:900;font-size:12px}
textarea{width:100%;min-height:150px;border-radius:18px;border:0;background:#fff;color:#172016;padding:14px;font-size:18px;font-weight:800;margin-top:12px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}button{min-height:52px;border:0;border-radius:999px;padding:0 18px;font-weight:1000;font-size:15px;cursor:pointer}.primary{background:linear-gradient(135deg,var(--gold),#fff2bf);color:#172016}.green{background:linear-gradient(135deg,var(--green),#bbf7d0);color:#052215}.plain{background:#fff;color:#172016}.status{margin-top:14px;padding:13px;border-radius:16px;background:rgba(255,255,255,.07);line-height:1.45}.ok{border:1px solid rgba(34,197,94,.4)}.err{border:1px solid rgba(248,113,113,.45)}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="badge">TEST ISOLÉ · AUCUNE ÉCRITURE</div>
<h1>🎙 WORLD8 — Test voix</h1>
<p>Teste uniquement le micro navigateur, la transcription et la restitution vocale. Cette page ne touche ni Supabase ni les données PRO CARNET.</p>
<textarea id="txt" placeholder="Dis : J’ai encaissé 15000 Wave pour POS"></textarea>
<div class="actions">
<button class="primary" id="start">🎙 Parler</button>
<button class="plain" id="stop">⏹ Stop</button>
<button class="green" id="speak">🔊 Lire le texte</button>
<button class="plain" id="clear">Effacer</button>
</div>
<div class="status" id="status">Prêt. Touche 🎙 Parler.</div>
</div></div>
<script>
(()=>{
const $=id=>document.getElementById(id),txt=$("txt"),status=$("status");let rec=null;
const setStatus=(m,k="")=>{status.className="status"+(k?" "+k:"");status.textContent=m};
const SR=()=>window.SpeechRecognition||window.webkitSpeechRecognition||null;
$("start").onclick=()=>{const R=SR();if(!window.isSecureContext){setStatus("Micro bloqué : HTTPS requis.","err");return}if(!R){setStatus("Reconnaissance vocale indisponible ici. Essaie Chrome.","err");return}try{if(rec)try{rec.abort()}catch(_){}rec=new R();rec.lang="fr-SN";rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;rec.onstart=()=>setStatus("🎙 J’écoute…","ok");rec.onresult=e=>{let f="",i="";for(let n=e.resultIndex;n<e.results.length;n++){const p=e.results[n][0]?.transcript||"";e.results[n].isFinal?f+=p:i+=p}const s=(f||i).trim();if(s)txt.value=s;if(f)setStatus("✅ Transcription reçue : "+f.trim(),"ok")};rec.onerror=e=>setStatus("Erreur micro : "+(e.error||"inconnue"),"err");rec.onend=()=>{if(!txt.value.trim())setStatus("Écoute terminée sans texte.")};rec.start()}catch(e){setStatus("Impossible de démarrer le micro : "+(e.message||e),"err")}};
$("stop").onclick=()=>{try{if(rec)rec.stop()}catch(_){}setStatus("⏹ Micro arrêté.")};
$("speak").onclick=()=>{const t=txt.value.trim();if(!t){setStatus("Dicte ou écris une phrase d’abord.","err");return}if(!("speechSynthesis" in window)||!window.SpeechSynthesisUtterance){setStatus("Restitution vocale indisponible ici.","err");return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";u.onstart=()=>setStatus("🔊 Lecture en cours…","ok");u.onend=()=>setStatus("✅ Restitution terminée.","ok");u.onerror=()=>setStatus("Erreur de restitution vocale.","err");speechSynthesis.speak(u)}catch(e){setStatus("Impossible de lire : "+(e.message||e),"err")}};
$("clear").onclick=()=>{txt.value="";try{speechSynthesis.cancel()}catch(_){}setStatus("Effacé. Prêt.")};
})();
</script>
</body></html>
